<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking for {{competition['name']}} || GUDLFT</title>
</head>
<body>
    <h2>{{competition['name']}}</h2>
    Places available: {{competition['numberOfPlaces']}}
    {% if maxPlaces > 0 %}
    <form action="/purchasePlaces" method="post">
        <input type="hidden" name="club" value="{{club['name']}}">
        <input type="hidden" name="competition" value="{{competition['name']}}">
        <label for="places">How many places? (1 to {{ maxPlaces }})</label>
        <input type="number" name="places" id="places" min="1" max="{{ maxPlaces }}" required />
        <button type="submit">Book</button>
    </form>
    {% else %}
    <p>Aucune place ne peut être réservée par votre club pour cette compétition.</p>
    {% endif %}
</body>
</html>
